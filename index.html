<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1c1438" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A Zelda-style chess adventure: explore 3D realms, collect chess pieces, and checkmate bosses." />
    <title>Pawn's Legend</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="scene"></div>
    <div id="controls" class="hidden">
      <div class="stick"><div class="stick-knob"></div></div>
      <button class="pad-btn btn-b" type="button" aria-label="Leap">B</button>
      <button class="pad-btn btn-a" type="button" aria-label="Act">A</button>
      <button class="pad-btn btn-cam" type="button" aria-label="Camera mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-2.5h6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <div class="cam-banner">Camera mode · the joystick turns and tilts the view<br /><small>Tap the camera button again to walk</small></div>
    </div>
    <div id="ui"></div>
    <div id="fade"></div>
    <div id="boot">Setting up the board…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
